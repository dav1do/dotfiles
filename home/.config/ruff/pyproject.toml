# Global ruff config. Must be named pyproject.toml, which is why the sections
# carry the [tool.ruff] prefix — a standalone ruff.toml uses bare [lint]/[format].
#
# Ruff does NOT merge configs: a repo with its own [tool.ruff] replaces this file
# wholesale. A repo whose pyproject.toml has no [tool.ruff] doesn't block it.

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long — the formatter owns line length
]

[tool.ruff.format]
# Ruff's default, stated explicitly: match the wider Python ecosystem rather
# than personal preference, so scripts don't churn against other people's tools.
quote-style = "double"
