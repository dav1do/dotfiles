theme = "catppuccin_mocha_dim"

[editor]
line-number = "absolute"
cursorline = true
color-modes = true
bufferline = "multiple"
true-color = true
scrolloff = 8
completion-trigger-len = 3
# Default is 250ms *after* trigger-len is satisfied. The docstring on
# Config::completion_timeout says "set to 5 for instant" — trigger-len already
# controls the noise, so there's no reason to also wait a quarter second.
completion-timeout = 5
text-width = 100
rulers = [100]
end-of-line-diagnostics = "hint"
# Save when focus leaves helix (tmux pane switch, terminal blur). Deliberately
# no `after-delay` — that would fire auto-format mid-thought.
auto-save = { focus-lost = true }
# Formatters cover most languages here; this catches the ones without one.
trim-trailing-whitespace = true
trim-final-newlines = true
# Labels for `gw` (goto_word) in typing order instead of alphabetical, so the
# first labels handed out land under your fingers. Parsed as a string, not a list.
jump-label-alphabet = "asdfghjklwertyuiopqzxcvbnm"
# Colours nesting depth rather than dimming annotation — the one readability lever
# that acts on the code itself. Needs `rainbows.scm`, which rust ships (91 of the
# bundled languages do).
rainbow-brackets = true
# Frames hovers and completion menus, which otherwise float borderless over code.
popup-border = "popup"
# to use system clipboard by default
# default-yank-register = "+"

# Buffer-word completion. helix ships this enabled at trigger-length 7, which is
# long enough that it effectively never fires. 5 makes it useful in files with no
# language server (tmux.conf, Makefiles, plain text).
[editor.word-completion]
trigger-length = 5

# Long rustc/tsc messages render as virtual text under the cursor line instead of
# being truncated at EOL. Anything below `warning` still goes to EOL via
# `end-of-line-diagnostics` above — a diagnostic shown inline is excluded from
# EOL, so there's no double render. `other-lines` stays disabled: virtual text on
# non-cursor lines shifts the whole viewport as you move.
[editor.inline-diagnostics]
cursor-line = "warning"

[editor.statusline]
left = [
    "mode",
    "spinner",
    "file-name",
    "read-only-indicator",
    "file-modification-indicator",
]
center = []
right = [
    "diagnostics",
    "selections",
    "register",
    "position",
    "file-encoding",
    "file-line-ending",
    "file-type",
]

[editor.lsp]
display-inlay-hints = true
# Ambient version of `space h`. rust-analyzer's highlightRelated.* are all on by
# default, so this also covers exit points, break points and closure captures —
# not just plain references.
auto-document-highlight = true
display-messages = true
auto-signature-help = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
#git-ignore = false

[editor.indent-guides]
render = true
character = "│"

[editor.soft-wrap]
enable = true
wrap-at-text-width = false

[editor.whitespace.render]
nbsp = "all"
tab = "all"

[keys.normal]
C-s = ":w"
# C-q is unbound in normal mode — helix only uses it inside window mode
# (`C-w C-q` = wclose), so there's nothing to shadow. `:wqa` and not `:q`
# because `:q` on the last view refuses to exit while *any* buffer is dirty,
# not just this one, which is the annoyance being fixed. It still bails rather
# than exiting if a modified scratch buffer has no filename.
C-q = ":write-quit-all"
# S-h = ":buffer-previous"
# S-l = ":buffer-next"
esc = ["collapse_selection", "keep_primary_selection"]
A-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
A-k = [
    "extend_to_line_bounds",
    "delete_selection",
    "move_line_up",
    "paste_before",
]
C-e = "scroll_down"
C-y = "scroll_up"
# `=` is format_selections, which only asks a language server for range
# formatting — it never touches the `formatter` entries in languages.toml. Of the
# languages configured there it's correct in python (ruff LSP == ruff format),
# silently *wrong* in ts/tsx/js/jsx (vtsls advertises range formatting, so it
# reformats to tsserver style and the next save undoes it in prettier style), and
# dead everywhere else (rust-analyzer and vscode-json-language-server both
# advertise range: false). `:format` uses the same path as format-on-save.
"=" = ":format"

[keys.insert]
C-s = [":w", "normal_mode"]

[keys.select]
A-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
A-k = [
    "extend_to_line_bounds",
    "delete_selection",
    "move_line_up",
    "paste_before",
]
"=" = ":format"

[keys.normal.g]
o = "flip_selections"
[keys.select.g]
o = "flip_selections"

# `m` gives back the jumplist push that C-s = ":w" took away — helix has no vim
# marks, so this plus C-o / space j is the mark story.
[keys.normal.space]
m = "save_selection"
q = ":buffer-close"
Q = ":buffer-close-others"
l = ":lsp-restart"
L = ":log-open"
# `=` because that's already format-selection in normal mode; `:format` is the
# whole-file version and, unlike `=`, goes through the external formatter too.
"=" = ":format"
# z as in zen: this file rendered in a reading column, floated over this pane.
# `Z` takes the whole tmux window instead. `:update` first — the reader reads
# from disk, not the buffer.
z = [":update", ":sh ~/.local/bin/tmux-read --pane '%{file_path_absolute}'"]
Z = [":update", ":sh ~/.local/bin/tmux-read --window '%{file_path_absolute}'"]
# `run-test` resolves the test enclosing the cursor and runs it in a tmux popup
# over this pane. helix can't do this itself: rust-analyzer offers "run test"
# through the custom `experimental/runnables` LSP extension, not as a code
# action, so it never appears in `space a`.
#
# `T` rather than `t` because `space t` is the toggle submenu below. One key
# only: with the cursor outside a test it already falls back to the whole crate
# (rust) or the whole file (pytest, vitest).
#
# The quotes are the *shell's*, not helix's: `:sh` sets raw_after = 1, so
# everything after the program name is a single Expand token — quoting rules
# stop applying and `%{...}` still expands. `:update` first because run-test
# reads the file from disk, not the buffer.
T = [":update", ":sh run-test '%{file_path_absolute}:%{cursor_line}'"]
# This file's path to the clipboard. Not `space Y` — that's helix's
# yank_main_selection_to_clipboard, the single-cursor counterpart to `space y`.
# `%%s` because helix reads `%` in a command's raw args as an expansion, so a bare
# `printf %s` dies with "missing a string delimiter after '%s'" before the shell runs.
"o" = ":sh printf %%s '%{file_path_absolute}' | pbcopy"

# `:toggle` flips editor config live and applies to every buffer — there is no
# per-buffer wrap. It needs the key to already have a non-null value, which is
# why `soft-wrap.enable` is set explicitly above rather than left to default.
[keys.normal.space.t]
w = ":toggle soft-wrap.enable"
n = ":toggle line-number relative absolute"
i = ":toggle lsp.display-inlay-hints"
g = ":toggle indent-guides.render"
W = ":toggle soft-wrap.wrap-at-text-width"

[keys.select.space]
m = "save_selection"
